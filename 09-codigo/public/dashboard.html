<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authority Engine · Control Room</title>
<style>
:root{--bg:#0b0d14;--panel:#121622;--panel2:#171c2b;--line:#2a3247;--text:#f5f7fb;--muted:#8f9ab2;--blue:#5b8cff;--purple:#a979ff;--green:#57d6a0;--amber:#f5bd5a;--red:#ff7080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 18px;background:#0e111b}.brand{font-weight:800;font-size:20px;letter-spacing:-.04em;margin-bottom:38px}.brand span{color:var(--blue)}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:12px 14px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{color:var(--text);background:var(--panel2)}.stack{display:flex;flex-direction:column;gap:10px}.side-foot{position:fixed;bottom:24px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px}.main{padding:32px 42px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.top h1{font-size:32px;letter-spacing:-.05em;margin:5px 0 8px}.top p{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:10px 14px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{filter:brightness(1.12)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:750;margin-top:8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.section h2{font-size:16px;margin:0 0 16px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stage{padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;min-width:150px}.stage strong{display:block;font-size:12px;margin-top:6px}.arrow{color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:12px;background:var(--panel2);border-radius:8px;border:1px solid transparent}.row:hover{border-color:var(--line)}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#25304a;color:#b9caff}.tag.green{background:#173d36;color:var(--green)}.tag.amber{background:#44351e;color:var(--amber)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.dialog{width:min(580px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.form input,.form textarea,.form select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px}.form textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.status{font-size:12px;color:var(--green);min-height:18px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.main{padding:24px 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:23px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Authority<span>Engine</span></div><div class="eyebrow">Control room</div><nav class="nav stack" id="nav"><button class="active" data-view="overview">Overview</button><button data-view="radar">Opportunity Radar</button><button data-view="seeds">Influencer Seeds</button><button data-view="profiles">Avatars / Profiles</button><button data-view="content">Post Machine</button></nav><div class="side-foot"><span class="dot"></span>API local conectada</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="crumb">Portfolio / Overview</div><h1 id="title">Authority Engine</h1><p id="subtitle">Descubra, desenvolva e opere ativos próprios de autoridade.</p></div><button class="btn primary" id="newBtn">+ Nova oportunidade</button></header><div id="view"></div></main></div>
<div class="modal hidden" id="modal"><div class="dialog"><h2>Nova oportunidade</h2><form class="form" id="oppForm"><label>Nicho<input name="niche" required placeholder="ex.: business displays"></label><label>Subnicho<input name="subniche" required placeholder="ex.: trade show lighting"></label><label>Problema<textarea name="problem" required placeholder="Qual problema recorrente existe?" ></textarea></label><label>Audiência<input name="audience" required placeholder="Quem precisa resolver isso?"></label><div class="status" id="formStatus"></div><div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Criar opção</button></div></form></div></div>
<script>
const state={opportunities:[],seeds:[],profiles:[],content:[],approvals:[],briefs:[],assets:[],receipts:[],metrics:[],feedback:[],events:[]};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function refresh(){const r=await fetch('/api/state');Object.assign(state,await r.json());render()} function count(k){return state[k]?.length??0}
function render(){const view=document.querySelector('[data-view].active')?.dataset.view||'overview'; const titles={overview:['Authority Engine','Descubra, desenvolva e opere ativos próprios de autoridade.'],radar:['Opportunity Radar','Oportunidades pesquisadas antes de qualquer execução.'],seeds:['Influencer Seeds Creator','Compare arquétipos, funções e modelos de perfil.'],profiles:['Influencer Farmer','Desenvolva avatares de autoridade com identidade e guardrails.'],content:['Post Machine','Produção editorial, aprovação e publicação assistida.']};$('#title').textContent=titles[view][0];$('#subtitle').textContent=titles[view][1];$('#crumb').textContent='Portfolio / '+titles[view][0]; $('#view').innerHTML=views[view]();}
const views={overview:()=>`<div class="cards"><div class="card"><div class="eyebrow">Oportunidades</div><div class="metric">${count('opportunities')}</div><div class="muted">Radar</div></div><div class="card"><div class="eyebrow">Seeds</div><div class="metric">${count('seeds')}</div><div class="muted">opções de persona</div></div><div class="card"><div class="eyebrow">Avatars</div><div class="metric">${count('profiles')}</div><div class="muted">em desenvolvimento</div></div><div class="card"><div class="eyebrow">Conteúdo</div><div class="metric">${count('content')}</div><div class="muted">na máquina</div></div></div><div class="section"><h2>Pipeline de criação</h2><div class="flow"><div class="stage"><span class="eyebrow">01</span><strong>Opportunity Radar</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">02</span><strong>Influencer Seeds</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">03</span><strong>Influencer Farmer</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">04</span><strong>Post Machine</strong></div></div></div><div class="grid"><div class="section"><h2>Últimas oportunidades</h2>${oppRows(4)}</div><div class="section"><h2>Governança</h2><div class="list"><div class="row"><span>Publicação automática</span><span class="tag amber">bloqueada</span></div><div class="row"><span>Integrações externas</span><span class="tag amber">não configuradas</span></div><div class="row"><span>API local</span><span class="tag green">operacional</span></div></div></div></div>`,radar:()=>`<div class="section"><div class="top"><div><h2>Opções de oportunidade</h2><span class="muted">Nada avança sem evidência e seleção humana.</span></div><button class="btn primary" onclick="openModal()">+ Criar opção</button></div>${oppRows()}</div>`,seeds:()=>`<div class="section"><h2>Influencer Seeds</h2>${genericRows('seeds','Nenhuma seed criada. Gere uma a partir de uma oportunidade qualificada.')}</div>`,profiles:()=>`<div class="section"><h2>Avatars / Profiles</h2>${genericRows('profiles','Nenhum avatar desenvolvido. O Farmer recebe uma seed selecionada.')}</div>`,content:()=>`<div class="section"><h2>Post Machine</h2>${genericRows('content','Nenhum conteúdo na fila. O conteúdo só entra com briefing, fonte e guardrails.')}`};
function oppRows(n){const a=state.opportunities.slice(-n).reverse();return a.length?'<div class="list">'+a.map(o=>`<div class="row"><div><strong>${esc(o.niche)} / ${esc(o.subniche)}</strong><div class="muted">${esc(o.audience)} · ${esc(o.problem)}</div></div><span class="tag">${esc(o.status)}</span></div>`).join('')+'</div>':'<div class="empty">Nenhuma oportunidade ainda.<br><button class="btn" style="margin-top:12px" onclick="openModal()">Criar primeira opção</button></div>'}
function genericRows(k,msg){const a=state[k];return a.length?'<div class="list">'+a.map(x=>`<div class="row"><div><strong>${esc(x.name||x.brand||x.topic||x.id)}</strong><div class="muted">${esc(x.archetype||x.status||'registro')}</div></div><span class="tag">${esc(x.status||'draft')}</span></div>`).join('')+'</div>':`<div class="empty">${msg}</div>`}
function openModal(){$('#modal').classList.remove('hidden');$('#oppForm').reset();$('#formStatus').textContent=''} function closeModal(){$('#modal').classList.add('hidden')}
$('#newBtn').onclick=openModal;$('#cancel').onclick=closeModal;$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};$('#oppForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/opportunities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok){$('#formStatus').textContent='Não foi possível criar a opção.';return}closeModal();await refresh()};refresh();
</script></body></html>
