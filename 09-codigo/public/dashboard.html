<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authority Engine · Control Room</title>
<style>
:root{--bg:#0b0d14;--panel:#121622;--panel2:#171c2b;--line:#2a3247;--text:#f5f7fb;--muted:#8f9ab2;--blue:#5b8cff;--purple:#a979ff;--green:#57d6a0;--amber:#f5bd5a;--red:#ff7080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 18px;background:#0e111b}.brand{font-weight:800;font-size:20px;letter-spacing:-.04em;margin-bottom:38px}.brand span{color:var(--blue)}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:12px 14px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{color:var(--text);background:var(--panel2)}.stack{display:flex;flex-direction:column;gap:10px}.side-foot{position:fixed;bottom:24px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px}.main{padding:32px 42px;max-width:1400px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.top h1{font-size:32px;letter-spacing:-.05em;margin:5px 0 8px}.top p{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:10px 14px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:0.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.metric{font-size:28px;font-weight:750;margin-top:8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.section h2{font-size:16px;margin:0 0 16px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stage{padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;min-width:150px}.stage strong{display:block;font-size:12px;margin-top:6px}.arrow{color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:12px;background:var(--panel2);border-radius:8px;border:1px solid transparent}.row:hover{border-color:var(--line)}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#25304a;color:#b9caff}.tag.green{background:#173d36;color:var(--green)}.tag.amber{background:#44351e;color:var(--amber)}.tag.blue{background:#1e3a5f;color:var(--blue)}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.dialog{width:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.form input,.form textarea,.form select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px}.form textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.status{font-size:12px;color:var(--green);min-height:18px}.pipeline-step{display:flex;align-items:center;gap:12px;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}.step-num{width:36px;height:36px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-weight:700}.step-content h4{margin:0 0 4px;font-size:14px}.step-content p{margin:0;color:var(--muted);font-size:12px}.step-actions{margin-left:auto;display:flex;gap:8px}.seed-card{display:flex;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.seed-info{flex:1}.seed-info h4{margin:0 0 4px}.seed-info .muted{font-size:12px}.seed-traits{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.trait{font-size:11px;padding:3px 8px;background:#1e2a3a;border-radius:99px;color:#a5c8ff}.profile-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.profile-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.profile-sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-section h5{margin:0 0 8px;color:var(--muted);font-size:11px;text-transform:uppercase}.profile-section ul{margin:0;padding-left:18px}.profile-section li{margin:4px 0;color:var(--muted);font-size:13px}.pm-output{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}.pm-output h4{margin:0 0 12px}.pm-section{margin-bottom:12px}.pm-section h5{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase}.pm-item{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:6px}.pm-item strong{display:block;margin-bottom:4px;font-size:13px}.pm-item p{margin:0;color:var(--muted);font-size:12px}.research-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}.research-card h4{margin:0 0 8px}.research-card .muted{font-size:12px}.research-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.research-col h5{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase}.research-col ul{margin:0;padding-left:18px;font-size:12px}.research-col li{margin:3px 0}.loading{display:inline-block;width:16px;height:16px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.main{padding:24px 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.profile-sections{grid-template-columns:1fr}.research-grid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:23px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Authority<span>Engine</span></div><div class="eyebrow">Control room</div><nav class="nav stack" id="nav"><button class="active" data-view="overview">Overview</button><button data-view="radar">Opportunity Radar</button><button data-view="seeds">Influencer Seeds</button><button data-view="farmer">Influencer Farmer</button><button data-view="postmachine">Post Machine</button></nav><div class="side-foot"><span class="dot"></span>API local conectada</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="crumb">Portfolio / Overview</div><h1 id="title">Authority Engine</h1><p id="subtitle">Descubra, desenvolva e opere ativos próprios de autoridade.</p></div><button class="btn primary" id="newBtn">+ Nova oportunidade</button></header><div id="view"></div></main></div>
<div class="modal hidden" id="modal"><div class="dialog"><h2 id="modalTitle">Nova oportunidade</h2><form class="form" id="oppForm"><label>Nicho<input name="niche" required placeholder="ex.: business displays"></label><label>Subnicho<input name="subniche" required placeholder="ex.: trade show lighting"></label><label>Problema<textarea name="problem" required placeholder="Qual problema recorrente existe?"></textarea></label><label>Audiência<input name="audience" required placeholder="Quem precisa resolver isso?"></label><div class="status" id="formStatus"></div><div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Criar opção</button></div></form></div></div>
<div class="modal hidden" id="modalResearch"><div class="dialog"><h2>Pesquisa Profunda (LLM)</h2><div class="form"><label>ID da Oportunidade<input name="opportunityId" required></label><div class="status" id="researchStatus"></div><div class="actions"><button type="button" class="btn" id="cancelResearch">Cancelar</button><button class="btn primary" id="runResearch"><span class="loading hidden" id="researchLoader"></span>Executar Pesquisa</button></div></form></div></div>
<div class="modal hidden" id="modalSeeds"><div class="dialog"><h2>Arquétipos Sugeridos</h2><div id="seedsList" class="list"></div><div class="actions"><button type="button" class="btn" id="cancelSeeds">Cancelar</button></div></div></div>
<div class="modal hidden" id="modalFarmer"><div class="dialog"><h2>Desenvolver Perfil</h2><form class="form" id="farmerForm"><input type="hidden" name="seedId" id="farmerSeedId"><label>Temas transversais (opcional)<textarea name="themes" placeholder="Um por linha..."></textarea></label><div class="status" id="farmerStatus"></div><div class="actions"><button type="button" class="btn" id="cancelFarmer">Cancelar</button><button class="btn primary">Desenvolver Perfil</button></div></form></div></div>
<div class="modal hidden" id="modalPostMachine"><div class="dialog"><h2>Gerar Conteúdo Semanal</h2><form class="form" id="pmForm"><label>Perfil aprovado<select name="profileId" id="pmProfileId" required><option value="">Selecione...</option></select></label><label>Semana<input name="week" type="number" value="1" min="1" max="4"></label><div class="status" id="pmStatus"></div><div class="actions"><button type="button" class="btn" id="cancelPM">Cancelar</button><button class="btn primary" id="runPM"><span class="loading hidden" id="pmLoader"></span>Gerar Conteúdo</button></div></form></div></div>
<script>
const state={opportunities:[],seeds:[],profiles:[],content:[],approvals:[],briefs:[],assets:[],receipts:[],metrics:[],feedback:[],events:[],research:[],farmer_profiles:[],post_machine:[]};
const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#039;'}[c]));
async function refresh(){const r=await fetch('/api/state');Object.assign(state,await r.json());render()}
function count(k){return state[k]?.length??0}
function render(){const view=document.querySelector('[data-view].active')?.dataset.view||'overview';
const titles={overview:['Authority Engine','Descubra, desenvolva e opere ativos próprios de autoridade.'],radar:['Opportunity Radar','Oportunidades pesquisadas antes de qualquer execução.'],seeds:['Influencer Seeds Creator','Compare arquétipos, funções e modelos de perfil.'],farmer:['Influencer Farmer','Desenvolva avatares de autoridade com identidade e guardrails.'],postmachine:['Post Machine','Produção editorial, aprovação e publicação assistida.']};
$('#title').textContent=titles[view][0];$('#subtitle').textContent=titles[view][1];$('#crumb').textContent='Portfolio / '+titles[view][0];
$('#view').innerHTML=views[view]();}
const views={overview:()=>`<div class="cards"><div class="card"><div class="eyebrow">Oportunidades</div><div class="metric">${count('opportunities')}</div><div class="muted">Radar</div></div><div class="card"><div class="eyebrow">Seeds</div><div class="metric">${count('seeds')}</div><div class="muted">opções de persona</div></div><div class="card"><div class="eyebrow">Avatars</div><div class="metric">${count('farmer_profiles')}</div><div class="muted">desenvolvidos</div></div><div class="card"><div class="eyebrow">Conteúdo</div><div class="metric">${count('post_machine')}</div><div class="muted">semanas geradas</div></div></div><div class="section"><h2>Pipeline de criação</h2><div class="flow"><div class="stage"><span class="eyebrow">01</span><strong>Opportunity Radar</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">02</span><strong>Influencer Seeds</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">03</span><strong>Influencer Farmer</strong></div><span class="arrow">→</span><div class="stage"><span class="eyebrow">04</span><strong>Post Machine</strong></div></div></div><div class="grid"><div class="section"><h2>Últimas oportunidades</h2>${oppRows(4)}</div><div class="section"><h2>Governança</h2><div class="list"><div class="row"><span>Publicação automática</span><span class="tag amber">bloqueada</span></div><div class="row"><span>Integrações externas</span><span class="tag amber">não configuradas</span></div><div class="row"><span>API local</span><span class="tag green">operacional</span></div></div></div></div>`,radar:()=>`<div class="section"><div class="top"><div><h2>Oportunidades</h2><span class="muted">Nada avança sem evidência e seleção humana.</span></div><div style="display:flex;gap:8px"><button class="btn primary" onclick="openModal()">+ Nova oportunidade</button><button class="btn" onclick="openResearchModal()">🔍 Pesquisa Profunda</button></div></div>${oppRows()}</div>`,seeds:()=>`<div class="section"><div class="top"><div><h2>Influencer Seeds</h2><span class="muted">Selecione uma pesquisa para gerar arquétipos.</span></div><select id="researchSelect" class="btn" style="max-width:300px"><option value="">Selecione pesquisa...</option>${state.research.filter(r=>r.status==='completed').map(r=>`<option value="${r.id}">${esc(r.research?.marketSize?.slice(0,50)||'Pesquisa')} - ${r.opportunityId}</option>`).join('')}</select></div><div class="section"><h2>Seeds Geradas</h2>${seedRows()}</div>`,farmer:()=>`<div class="section"><div class="top"><div><h2>Perfis Desenvolvidos</h2><span class="muted">Selecione uma seed para desenvolver o perfil completo.</span></div></div>${farmerRows()}</div>`,postmachine:()=>`<div class="section"><div class="top"><div><h2>Post Machine</h2><span class="muted">Gere conteúdo semanal para perfis aprovados.</span></div><button class="btn primary" onclick="openPMModal()">+ Gerar Semana</button></div>${pmRows()}</div>`};
function oppRows(n){const a=state.opportunities.slice(-n).reverse();return a.length?'<div class="list">'+a.map(o=>`<div class="pipeline-step"><div class="step-content"><h4>${esc(o.niche)} / ${esc(o.subniche)}</h4><p>${esc(o.audience)} · ${esc(o.problem)}</p></div><div class="step-actions"><span class="tag">${esc(o.status)}</span>${o.status==='candidate'?`<button class="btn" onclick="openResearchModal('${o.id}')">🔍 Pesquisar</button>`:''}</div></div>`).join('')+'</div>':'<div class="empty">Nenhuma oportunidade ainda.<br><button class="btn" style="margin-top:12px" onclick="openModal()">Criar primeira opção</button></div>'}
function seedRows(){const a=state.seeds;return a.length?'<div class="list">'+a.map(s=>`<div class="seed-card"><div class="seed-info"><h4>${esc(s.name)}</h4><div class="muted">${esc(s.archetype)} · ${esc(s.function?.slice(0,60)||'')}</div><div class="seed-traits">${s.traits?.map(t=>`<span class="trait">${esc(t)}</span>`).join('')||''}</div></div><div class="step-actions"><span class="tag ${s.status==='selected'?'green':s.status==='proposed'?'blue':'amber'}">${esc(s.status)}</span>${s.status==='proposed'?`<button class="btn" onclick="selectSeed('${s.id}')">Selecionar</button>`:s.status==='selected'?`<button class="btn primary" onclick="openFarmerModal('${s.id}')">Desenvolver</button>`:''}</div></div>`).join('')+'</div>':'<div class="empty">Nenhuma seed gerada. Gere a partir de uma pesquisa concluída.</div>'}
function farmerRows(){const a=state.farmer_profiles;return a.length?'<div class="list">'+a.map(p=>`<div class="profile-card"><div class="profile-header"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.archetype)} · ${p.pillars?.length||0} pilares · ${p.formats?.length||0} formatos</div></div><span class="tag ${p.status==='approved'?'green':p.status==='review'?'blue':'amber'}">${esc(p.status)}</span></div><div class="profile-sections"><div class="profile-section"><h5>Pilares</h5><ul>${p.pillars?.map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div><div class="profile-section"><h5>Formatos</h5><ul>${p.formats?.map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div><div class="profile-section"><h5>Temas transversais</h5><ul>${p.crossCuttingThemes?.map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div><div class="profile-section"><h5>Guardrails</h5><ul>${p.guardrails?.slice(0,4).map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="muted">—</li>'}</ul></div></div><div class="step-actions" style="margin-top:16px"><span class="tag ${p.status==='approved'?'green':'blue'}">${esc(p.status)}</span>${p.status==='review'?`<button class="btn primary" onclick="approveProfile('${p.id}')">Aprovar</button>`:`<button class="btn" onclick="openPMModal('${p.id}')">Gerar Conteúdo</button>`}</div></div>`).join('')+'</div>':'<div class="empty">Nenhum perfil desenvolvido. Selecione uma seed no módulo Seeds.</div>'}
function pmRows(){const a=state.post_machine;return a.length?'<div class="list">'+a.map(p=>`<div class="pm-output"><h4>Semana ${p.week} · Perfil: ${p.profileId?.slice(0,8)}...</h4><div class="pm-section"><h5>Artigos (${p.blogArticles?.length||0})</h5>${p.blogArticles?.map(b=>`<div class="pm-item"><strong>${esc(b.title)}</strong><p>${esc(b.seo?.metaDescription?.slice(0,120)||'')}</p></div>`).join('')||'<p class="muted">—</p>'}</div><div class="pm-section"><h5>Vídeos (${p.videoScripts?.length||0})</h5>${p.videoScripts?.map(v=>`<div class="pm-item"><strong>${esc(v.title)}</strong><p>${esc(v.structure?.hook?.slice(0,100)||'')}</p></div>`).join('')||'<p class="muted">—</p>'}</div><div class="pm-section"><h5>Shorts (${p.shorts?.length||0})</h5>${p.shorts?.map(s=>`<div class="pm-item"><strong>${esc(s.title)}</strong><p>${esc(s.caption?.slice(0,100)||'')}</p></div>`).join('')||'<p class="muted">—</p>'}</div><div class="pm-section"><h5>Stories (${p.stories?.length||0})</h5>${p.stories?.map(s=>`<div class="pm-item"><strong>${esc(s.title)}</strong><p>${esc(s.cta?.slice(0,100)||'')}</p></div>`).join('')||'<p class="muted">—</p>'}</div></div>`).join('')+'</div>':'<div class="empty">Nenhuma semana gerada. Selecione um perfil aprovado.</div>'}
function openModal(oid=''){$('#modal').classList.remove('hidden');$('#oppForm').reset();$('#formStatus').textContent='';if(oid)$('#oppForm').querySelector('input[name=niche]').value=''}
function closeModal(){$('#modal').classList.add('hidden')}
function openResearchModal(oid=''){$('#modalResearch').classList.remove('hidden');$('#researchStatus').textContent='';$('#researchLoader').classList.add('hidden');if(oid)$('#modalResearch').querySelector('input[name=opportunityId]').value=oid}
function closeResearchModal(){$('#modalResearch').classList.add('hidden')}
function openSeedsModal(researchId){$('#modalSeeds').classList.remove('hidden');loadSeedsForResearch(researchId)}
function closeSeedsModal(){$('#modalSeeds').classList.add('hidden')}
function openFarmerModal(seedId){$('#modalFarmer').classList.remove('hidden');$('#farmerSeedId').value=seedId;$('#farmerStatus').textContent='';$('#farmerForm').reset()}
function closeFarmerModal(){$('#modalFarmer').classList.add('hidden')}
function openPMModal(profileId=''){$('#modalPostMachine').classList.remove('hidden');$('#pmStatus').textContent='';$('#pmLoader').classList.add('hidden');loadProfilesForPM();if(profileId)$('#pmProfileId').value=profileId}
function closePMModal(){$('#modalPostMachine').classList.add('hidden')}
async function loadSeedsForResearch(researchId){const r=await fetch('/api/seeds/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({researchId})});if(r.ok){const data=await r.json();render();openSeedsModal()}else{alert('Erro ao gerar seeds')}}
function loadProfilesForPM(){const r=await fetch('/api/farmer/profiles');const profiles=await r.json();const sel=$('#pmProfileId');sel.innerHTML='<option value="">Selecione...</option>';profiles.filter(p=>p.status==='approved').forEach(p=>sel.innerHTML+=`<option value="${p.id}">${esc(p.name)} (${esc(p.archetype)})</option>`)}
async function selectSeed(seedId){const r=await fetch('/api/seeds/select',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({seedId})});if(r.ok){await refresh()}else{alert('Erro ao selecionar seed')}}
async function approveProfile(profileId){const r=await fetch('/api/farmer/profile/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId})});if(r.ok){await refresh()}else{alert('Erro ao aprovar')}}
$('#newBtn').onclick=()=>openModal();
$('#cancel').onclick=closeModal;
$('#cancelResearch').onclick=closeResearchModal;
$('#cancelSeeds').onclick=closeSeedsModal;
$('#cancelFarmer').onclick=closeFarmerModal;
$('#cancelPM').onclick=closePMModal;
$('#runResearch').onclick=async()=>{const opportunityId=$('#modalResearch input[name=opportunityId]').value;if(!opportunityId){alert('Informe o ID');return}$('#runResearch').disabled=true;$('#researchLoader').classList.remove('hidden');$('#researchStatus').textContent='Executando pesquisa...';const r=await fetch('/api/opportunities/research',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({opportunityId})});if(r.ok){$('#researchStatus').textContent='Pesquisa concluída!';setTimeout(()=>{closeResearchModal();refresh()},1000)}else{const err=await r.json();$('#researchStatus').textContent='Erro: '+err.error}$('#runResearch').disabled=false;$('#researchLoader').classList.add('hidden')};
$('#oppForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/opportunities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok){$('#formStatus').textContent='Não foi possível criar a opção.';return}closeModal();await refresh()};
$('#farmerForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const themes=data.themes?data.themes.split('\n').map(t=>t.trim()).filter(Boolean):[];const r=await fetch('/api/farmer/profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({seedId:data.seedId,selectedThemes:themes})});if(!r.ok){$('#farmerStatus').textContent='Erro ao desenvolver perfil';return}closeFarmerModal();await refresh()};
$('#pmForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const week=parseInt(data.week)||1;$('runPM').disabled=true;$('#pmLoader').classList.remove('hidden');$('#pmStatus').textContent='Gerando conteúdo...';const r=await fetch('/api/post-machine/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profileId:data.profileId,week})});if(r.ok){$('#pmStatus').textContent='Conteúdo gerado!';setTimeout(()=>{closePMModal();refresh()},1000)}else{const err=await r.json();$('#pmStatus').textContent='Erro: '+err.error}$('runPM').disabled=false;$('#pmLoader').classList.add('hidden')};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};
refresh();
</script></body></html>
